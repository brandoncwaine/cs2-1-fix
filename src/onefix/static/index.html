<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>One-Fix</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <h1 class="wordmark">One<span>-</span>Fix</h1>
  <div class="top-actions">
    <span id="synced" class="muted"></span>
    <button id="sync" type="button" hidden>Sync now</button>
    <form method="post" action="/logout"><button type="submit" class="quiet">Sign out</button></form>
  </div>
</header>
<nav id="players" class="players" aria-label="Players"></nav>
<main id="main" aria-live="polite"><p class="muted">Loading…</p></main>
<footer class="foot muted">
  Built from your own match demos after the match. Not affiliated with Valve.
</footer>
</body>
</html>
